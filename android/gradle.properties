# Project-wide Gradle settings.

# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Run sub-projects in parallel.
org.gradle.parallel=true

# Use the Gradle build cache.
org.gradle.caching=true

# AndroidX is required by modern AndroidX dependencies.
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Keep R class generation non-transitive (smaller, faster, modern default).
android.nonTransitiveRClass=true
