<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Log in · MoneyMinder</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app">
    <main class="screen screen--auth">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="6" width="20" height="13" rx="3" /><path d="M16 12h.01" /><path d="M2 10h16" />
        </svg>
        MoneyMinder
      </div>
      <h1>Welcome back</h1>
      <p class="muted">Log in to keep an eye on your budget.</p>

      <form id="form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input class="input" id="username" name="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <p class="msg msg--error" id="error" role="alert" hidden></p>
        <button class="btn" type="submit" id="submit">Log in</button>
      </form>

      <p class="auth-foot">Access is currently limited to invited pilot participants.</p>
      <p class="auth-foot" id="registration-cta" hidden>Have an invitation? <a class="link" href="register.html">Create an account</a></p>
      <p class="auth-foot"><a class="link" href="pilot.html">Why MoneyMinder?</a></p>
      <p class="auth-foot"><a class="link" href="demo.html">View demo</a></p>
      <p class="auth-foot"><a class="link" href="privacy.html">Privacy</a></p>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/pwa.js"></script>
  <script>
    const form = document.getElementById("form");
    const error = document.getElementById("error");
    const submit = document.getElementById("submit");
    const registrationCta = document.getElementById("registration-cta");

    // Registration fails closed: only advertise the route after the server says
    // this deployment has enrollment open.
    fetch("register.html", {
      method: "HEAD",
      credentials: "same-origin",
      cache: "no-store",
    }).then((response) => {
      if (response.ok) registrationCta.hidden = false;
    }).catch(() => {
      registrationCta.hidden = true;
    });

    // Fields that can be flagged invalid, tied to the shared error message.
    const fields = [form.username, form.password];
    function clearInvalid() {
      fields.forEach((f) => { f.removeAttribute("aria-invalid"); f.removeAttribute("aria-describedby"); });
    }
    function markInvalid(field) {
      field.setAttribute("aria-invalid", "true");
      field.setAttribute("aria-describedby", "error");
    }

    function showError(msg, invalid) {
      error.textContent = msg;
      error.hidden = false;
      (invalid || []).forEach(markInvalid);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      error.hidden = true;
      clearInvalid();
      const username = form.username.value.trim();
      const password = form.password.value;
      if (!username || !password) {
        return showError("Enter your username and password.",
          [!username && form.username, !password && form.password].filter(Boolean));
      }
      submit.disabled = true;
      try {
        await API.post("/api/login", { username, password });
        location.href = "index.html";
      } catch (err) {
        showError(err.message, [form.username, form.password]);
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
