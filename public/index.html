<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Overview · MoneyMinder</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app app--nav">
    <main class="screen dashboard-screen">
      <div id="sk" aria-hidden="true">
        <div class="skeleton sk-line w-40"></div>
        <div class="skeleton sk-hero"></div>
        <div class="skeleton sk-block"></div>
      </div>

      <div id="dash" class="reveal" hidden>
        <header class="dashboard-head">
          <div>
            <p class="eyebrow" id="today"></p>
            <h1 id="greeting">Hi</h1>
          </div>
          <a class="avatar-link" href="profile.html" aria-label="Open profile" id="avatar">M</a>
        </header>

        <section class="overview-card" aria-labelledby="cost-title">
          <div class="overview-topline">
            <p id="cost-title">Your true cost this month</p>
            <span class="pill" id="track-pill">—</span>
          </div>
          <div class="overview-amount amount" id="hero-spent">—</div>
          <div class="overview-split">
            <div><span>Personal</span><strong class="amount" id="hero-personal">—</strong></div>
            <div><span>Shared</span><strong class="amount" id="hero-shared">—</strong></div>
          </div>
          <div class="budget-track" aria-hidden="true"><span id="budget-bar"></span></div>
          <div class="budget-caption">
            <span id="budget-used">—</span>
            <span id="budget-left">—</span>
          </div>
        </section>

        <a class="btn dashboard-primary" href="scan.html">Add an expense</a>

        <a class="settle-callout" id="settle-callout" href="household.html" hidden>
          <span><strong id="settle-title">—</strong><small>Open your household to settle up</small></span>
          <span aria-hidden="true">›</span>
        </a>

        <section class="dashboard-section" aria-labelledby="categories-title">
          <div class="section-head"><h2 id="categories-title">Where it goes</h2><a href="receipts.html">View all</a></div>
          <div class="category-list" id="category-list"></div>
        </section>

        <section class="dashboard-section" aria-labelledby="recent-title">
          <div class="section-head"><h2 id="recent-title">Recent activity</h2><a href="receipts.html">Receipts</a></div>
          <div class="activity-list" id="activity-list"></div>
        </section>

        <section class="dashboard-section" aria-labelledby="trend-title">
          <div class="section-head"><h2 id="trend-title">Last 14 days</h2></div>
          <div class="trend-surface" id="trend-svg"></div>
        </section>

        <aside class="promotion-card" id="promotion-card" aria-labelledby="promotion-title" hidden>
          <div class="promotion-topline">
            <span class="promotion-label">Sponsored</span>
            <button class="promotion-dismiss" id="promotion-dismiss" type="button" aria-label="Dismiss sponsored offer">×</button>
          </div>
          <h2 id="promotion-title"></h2>
          <p id="promotion-description"></p>
          <a class="promotion-link" id="promotion-link" rel="noreferrer sponsored"></a>
        </aside>
      </div>

      <p class="msg msg--error" id="error" role="alert" hidden></p>
    </main>
  </div>

  <nav class="nav" aria-label="Primary"></nav>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/onboard.js"></script>
  <script>
    renderNav("index.html");
    const fmt = API.formatMoney;
    const labels = { food: "Food", travel: "Travel", housing: "Housing", misc: "Misc", other: "Other" };

    function normalizePromotion(promotion) {
      if (!promotion || typeof promotion !== "object") return null;
      if (
        typeof promotion.id !== "string" ||
        typeof promotion.title !== "string" ||
        typeof promotion.description !== "string" ||
        typeof promotion.ctaLabel !== "string" ||
        typeof promotion.url !== "string"
      ) return null;

      const id = promotion.id.trim();
      const title = promotion.title.trim();
      const description = promotion.description.trim();
      const ctaLabel = promotion.ctaLabel.trim();
      if (
        !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id) ||
        !title || title.length > 80 ||
        !description || description.length > 240 ||
        !ctaLabel || ctaLabel.length > 40 ||
        promotion.url.length > 2048
      ) return null;

      let url;
      try {
        url = new URL(promotion.url);
      } catch {
        return null;
      }
      const hostname = url.hostname.toLowerCase().replace(/\.$/, "");
      if (
        url.protocol !== "https:" ||
        url.username ||
        url.password ||
        url.port ||
        !/^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$/i.test(hostname) ||
        /(^|\.)(localhost|local|internal|test|example|invalid|onion)$/i.test(hostname) ||
        hostname.endsWith(".home.arpa")
      ) return null;
      return { id, title, description, ctaLabel, url: url.href };
    }

    function reportPromotionEvent(promotionId, eventType) {
      return API.post(
        "/api/promotions/" + encodeURIComponent(promotionId) + "/events",
        { eventType },
        crypto.randomUUID(),
        { keepalive: true },
      ).catch(() => {
        // Aggregate promotion metrics are best-effort and never block product use.
      });
    }

    let visiblePromotionId = null;
    let impressionObserver = null;

    function observePromotionImpression(card, promotionId) {
      if (!("IntersectionObserver" in window)) return;
      if (impressionObserver) impressionObserver.disconnect();
      impressionObserver = new IntersectionObserver((entries, observer) => {
        const entry = entries[0];
        if (!entry || !entry.isIntersecting || entry.intersectionRatio < 0.5) return;
        observer.disconnect();
        impressionObserver = null;
        reportPromotionEvent(promotionId, "impression");
      }, { threshold: 0.5 });
      impressionObserver.observe(card);
    }

    function renderPromotion(promotion) {
      const safe = normalizePromotion(promotion);
      if (!safe) return;
      document.getElementById("promotion-title").textContent = safe.title;
      document.getElementById("promotion-description").textContent = safe.description;
      const link = document.getElementById("promotion-link");
      link.textContent = safe.ctaLabel;
      link.href = safe.url;
      const card = document.getElementById("promotion-card");
      visiblePromotionId = safe.id;
      card.hidden = false;
      observePromotionImpression(card, safe.id);
    }

    async function loadPromotion() {
      try {
        const { promotion } = await API.get("/api/promotions/current");
        renderPromotion(promotion);
      } catch {
        // Promotions are optional and fail closed without blocking the dashboard.
      }
    }

    document.getElementById("promotion-dismiss").addEventListener("click", () => {
      document.getElementById("promotion-card").hidden = true;
      visiblePromotionId = null;
      if (impressionObserver) impressionObserver.disconnect();
      impressionObserver = null;
    });

    document.getElementById("promotion-link").addEventListener("click", (event) => {
      if (!event.isTrusted || !visiblePromotionId) return;
      reportPromotionEvent(visiblePromotionId, "click");
    });

    (async () => {
      const error = document.getElementById("error");
      try {
        const [user, s, ins, receiptData, householdData] = await Promise.all([
          API.requireUser(),
          API.get("/api/summary"),
          API.get("/api/insights"),
          API.get("/api/receipts"),
          API.get("/api/households"),
        ]);
        const name = user.displayName || user.username;
        document.getElementById("today").textContent = new Intl.DateTimeFormat("en-IN", { day: "numeric", month: "long", year: "numeric" }).format(new Date());
        document.getElementById("greeting").textContent = "Hi, " + name;
        document.getElementById("avatar").textContent = name.charAt(0).toUpperCase();
        document.getElementById("hero-spent").textContent = fmt(s.spent);
        document.getElementById("hero-personal").textContent = fmt(s.personalSpent);
        document.getElementById("hero-shared").textContent = fmt(s.sharedShare);

        const budget = Number(s.budget) || 0;
        const used = budget ? Math.min(100, Math.round(s.spent / budget * 100)) : 0;
        document.getElementById("budget-bar").style.width = used + "%";
        document.getElementById("budget-used").textContent = budget ? used + "% of " + fmt(budget) + " budget" : "Set a monthly budget";
        document.getElementById("budget-left").textContent = budget ? fmt(Math.max(0, budget - s.spent)) + " left" : "";
        const pill = document.getElementById("track-pill");
        pill.className = "pill " + (s.onTrack ? "pill--ok" : "pill--over");
        pill.textContent = s.onTrack ? "On track" : "Over pace";

        const households = householdData.households || [];
        const balance = households.reduce((sum, h) => sum + Number(h.balance || 0), 0);
        if (Math.abs(balance) > 0.005) {
          const callout = document.getElementById("settle-callout");
          document.getElementById("settle-title").textContent = balance > 0 ? "You’re owed " + fmt(balance) : "You owe " + fmt(Math.abs(balance));
          callout.hidden = false;
        }

        const cats = Object.entries(s.categories).filter(([, value]) => Number(value) > 0).sort((a, b) => b[1] - a[1]).slice(0, 3);
        const max = Math.max(1, ...cats.map(([, value]) => Number(value) || 0));
        document.getElementById("category-list").innerHTML = cats.length ? cats.map(([key, value]) =>
          '<div class="category-row"><div><strong>' + labels[key] + '</strong><span>' + fmt(value) + '</span></div>' +
          '<div class="category-track" aria-hidden="true"><span style="width:' + Math.round((Number(value) || 0) / max * 100) + '%"></span></div></div>'
        ).join("") : '<div class="empty compact"><p>No spending this month.</p></div>';

        const receipts = (receiptData.receipts || []).slice(0, 4);
        document.getElementById("activity-list").innerHTML = receipts.length ? receipts.map((r) =>
          '<a class="activity-row" href="receipt.html?id=' + encodeURIComponent(r.id) + '">' +
          '<span><strong>' + API.escapeHtml(r.supplier || r.document || "Expense") + '</strong><small>' + API.escapeHtml(labels[r.category] || r.category || "Expense") + (r.date ? " · " + API.escapeHtml(r.date) : "") + '</small></span>' +
          '<strong class="amount">' + fmt(r.amount) + '</strong></a>'
        ).join("") : '<div class="empty compact"><p>No spending yet.</p><a class="link" href="scan.html">Scan your first receipt</a></div>';

        document.getElementById("trend-svg").innerHTML = Charts.trend(ins.daily || []);
        document.getElementById("sk").remove();
        document.getElementById("dash").hidden = false;
        loadPromotion();
        if (window.Onboard) Onboard.start();
      } catch (err) {
        document.getElementById("sk").remove();
        error.textContent = err.message;
        error.hidden = false;
      }
    })();
  </script>
</body>
</html>
