<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Create account · MoneyMinder</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app">
    <main class="screen screen--auth">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="6" width="20" height="13" rx="3" /><path d="M16 12h.01" /><path d="M2 10h16" />
        </svg>
        MoneyMinder
      </div>
      <h1>Create your account</h1>
      <p class="muted">Set a monthly budget and start tracking.</p>

      <form id="form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input class="input" id="username" name="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" maxlength="254" pattern="[^\s@]+@[^\s@]+\.[^\s@]+" required />
        </div>
        <div class="field">
          <label for="mobile">Mobile number</label>
          <input class="input" id="mobile" name="mobile" type="tel" autocomplete="tel" inputmode="tel" maxlength="20" pattern="\+?[0-9][0-9 -]{7,19}" required />
        </div>
        <div class="field">
          <label for="budget">Monthly budget (₹)</label>
          <input class="input" id="budget" name="budget" type="number" min="0" step="1" inputmode="numeric" required />
        </div>
        <div class="field">
          <label for="vpa">UPI ID <span class="muted">(optional)</span></label>
          <input class="input" id="vpa" name="vpa" autocomplete="off" placeholder="yourname@bank" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password" autocomplete="new-password" minlength="15" maxlength="72" required aria-describedby="password-hint" />
          <p class="msg muted" id="password-hint" style="margin:6px 0 0">At least 15 characters; maximum 72 UTF-8 bytes</p>
        </div>
        <p class="msg msg--error" id="error" role="alert" hidden></p>
        <button class="btn" type="submit" id="submit">Create account</button>
      </form>

      <p class="auth-foot">Already have an account? <a class="link" href="login.html">Log in</a></p>
      <p class="auth-foot">By creating an account, you agree to the <a class="link" href="privacy.html">pilot privacy notice</a>.</p>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/pwa.js"></script>
  <script>
    const form = document.getElementById("form");
    const error = document.getElementById("error");
    const submit = document.getElementById("submit");

    const fields = [form.username, form.email, form.mobile, form.budget, form.password];
    function clearInvalid() {
      fields.forEach((f) => {
        f.removeAttribute("aria-invalid");
        // Password keeps its permanent hint; others drop the describedby.
        if (f === form.password) f.setAttribute("aria-describedby", "password-hint");
        else f.removeAttribute("aria-describedby");
      });
    }
    function markInvalid(field) {
      field.setAttribute("aria-invalid", "true");
      // Point at the error too, preserving the password hint if present.
      const existing = field === form.password ? "password-hint " : "";
      field.setAttribute("aria-describedby", existing + "error");
    }

    function showError(msg, invalid) {
      error.textContent = msg;
      error.hidden = false;
      (invalid || []).forEach(markInvalid);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      error.hidden = true;
      clearInvalid();
      const username = form.username.value.trim();
      const email = form.email.value.trim();
      const mobile = form.mobile.value.trim();
      const budget = form.budget.value;
      const vpa = form.vpa.value.trim();
      const password = form.password.value;

      if (!username || !email || !mobile || budget === "") {
        return showError("Please fill in every field.",
          [!username && form.username, !email && form.email, !mobile && form.mobile, budget === "" && form.budget].filter(Boolean));
      }
      if (!form.email.checkValidity()) return showError("Enter a valid email address.", [form.email]);
      if (!form.mobile.checkValidity()) return showError("Enter a valid mobile number.", [form.mobile]);
      if (Number(budget) < 0 || Number.isNaN(Number(budget))) return showError("Budget must be a valid amount.", [form.budget]);
      if (Array.from(password).length < 15) return showError("Password must be at least 15 characters.", [form.password]);
      if (password.length > 72) return showError("Password must be at most 72 characters.", [form.password]);
      if (new TextEncoder().encode(password).length > 72) return showError("Password must be at most 72 UTF-8 bytes.", [form.password]);

      submit.disabled = true;
      try {
        const body = { username, email, mobile, budget: Number(budget), password };
        if (vpa) body.vpa = vpa;
        await API.post("/api/register", body);
        location.href = "index.html";
      } catch (err) {
        showError(err.message);
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
