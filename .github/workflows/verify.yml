name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-scan:
    name: OSV dependency scan
    permissions:
      actions: read
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --lockfile=package-lock.json
        --lockfile=android/gradle/verification-metadata.xml
      fail-on-vuln: true
      upload-sarif: false

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: npm
      - name: Pin npm
        run: |
          npm install --global npm@10.9.8 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "10.9.8"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low
      - name: Validate syntax, tests, and coverage
        run: npm run verify
      - name: Verify SQLite restart and concurrency
        run: npm run test:sqlite
      - name: Build Chrome Web Store package
        # Compile-only artifact; a publishable ZIP requires the operator's real origin.
        env:
          MONEYMINDER_SERVER_URL: https://github.com
        run: |
          npm run package:chrome
          version="$(node -p "require('./extension/manifest.json').version")"
          node scripts/verify-release-artifact.mjs chrome \
            "outputs/chrome-web-store/moneyminder-$version.zip"
      - name: Verify pinned Node runtime
        run: |
          grep --quiet '^FROM node:24\.18\.0-' Dockerfile
          grep --quiet '"node": ">=24\.18\.0"' package.json
          grep --quiet '"packageManager": "npm@10\.9\.8"' package.json
          grep --quiet 'node-version: 24\.18\.0' .github/workflows/verify.yml
      - name: Enforce announced Node security release
        run: |
          if [[ "$(date -u +%F)" > "2026-07-26" ]] && {
            grep --quiet '^FROM node:24\.18\.0-' Dockerfile ||
            grep --quiet '"node": ">=24\.18\.0"' package.json ||
            grep --quiet 'node-version: 24\.18\.0' .github/workflows/verify.yml
          }; then
            echo "Node 24.18.0 is blocked after the 2026-07-27 security advisory."
            echo "Repin Docker, CI, and package engines to the published patched Node 24.x release."
            exit 1
          fi
      - name: Verify pinned Node base image is current
        run: |
          base_ref="$(awk '/^FROM node:/ { print $2; exit }' Dockerfile)"
          tag="${base_ref#node:}"
          tag="${tag%@*}"
          expected="${base_ref#*@}"
          actual="$(curl --fail --retry 3 --silent --show-error \
            "https://hub.docker.com/v2/repositories/library/node/tags/$tag" |
            jq --exit-status --raw-output '.digest')"
          if [[ "$actual" != "$expected" ]]; then
            echo "Node base image moved: expected $expected, current $actual"
            exit 1
          fi
      - name: Build production container
        run: docker build --pull --tag moneyminder:verify .
      - name: Smoke-test production container
        run: |
          session_secret="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")"
          container_id="$(docker run --detach --network host \
            --memory 1g --cpus 1 \
            --health-interval 1s --health-start-period 1s --health-timeout 3s --health-retries 10 \
            --env APP_ORIGIN=https://moneyminder.test \
            --env TRUST_PROXY=loopback \
            --env SESSION_SECRET="$session_secret" \
            moneyminder:verify)"
          cleanup() { docker rm --force "$container_id" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          healthy=0
          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            if [[ "$status" == "healthy" ]]; then
              healthy=1
              break
            fi
            if [[ "$status" == "unhealthy" ]]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done
          if [[ "$healthy" != "1" ]]; then
            docker logs "$container_id"
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:3000/readyz
          node scripts/verify-production-enrollment.mjs \
            http://127.0.0.1:3000 https://moneyminder.test
          timeout 35s docker stop --time 30 "$container_id"
          if [[ "$(docker inspect --format '{{.State.ExitCode}}' "$container_id")" != "0" ]]; then
            docker logs "$container_id"
            exit 1
          fi

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android API 36
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - name: Create disposable CI release keystore
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/moneyminder-ci.jks" \
            -storepass ci-release-password \
            -alias ci-release \
            -keypass ci-release-password \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=MoneyMinder CI,OU=CI,O=MoneyMinder,C=IN"
          printf '%s\n' \
            "storeFile=$RUNNER_TEMP/moneyminder-ci.jks" \
            "storePassword=ci-release-password" \
            "keyAlias=ci-release" \
            "keyPassword=ci-release-password" \
            > android/keystore.properties
      - name: Validate, lint, and compile the Android release
        # Compile-only artifact; a publishable AAB requires the operator's real origin.
        working-directory: android
        run: >-
          bash ./gradlew --no-daemon
          --dependency-verification=strict
          :app:testReleaseServerUrlValidation
          :app:testReleaseSigningValidation
          :app:testAndroidPlatformContracts
          :app:validateReleaseServerUrl
          :app:lintRelease
          :app:assembleRelease
          :app:bundleRelease
          -PMONEYMINDER_SERVER_URL=https://github.com
      - name: Verify the exact Android release artifact
        env:
          BUNDLETOOL_VERSION: "1.18.3"
          MONEYMINDER_EXPECTED_BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
          MONEYMINDER_SERVER_URL: https://github.com
        run: |
          bundletool_jar="$RUNNER_TEMP/bundletool-all-$BUNDLETOOL_VERSION.jar"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$bundletool_jar" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          printf '%s  %s\n' "$MONEYMINDER_EXPECTED_BUNDLETOOL_SHA256" "$bundletool_jar" |
            sha256sum --check -
          signer_sha="$(
            keytool -J-Duser.language=en -list -v \
              -keystore "$RUNNER_TEMP/moneyminder-ci.jks" \
              -storepass ci-release-password \
              -alias ci-release |
              awk -F'SHA256: ' '/SHA256:/{print $2; exit}'
          )"
          test -n "$signer_sha"
          BUNDLETOOL_JAR="$bundletool_jar" \
          MONEYMINDER_EXPECTED_SIGNER_SHA256="$signer_sha" \
            node scripts/verify-release-artifact.mjs android \
              android/app/build/outputs/bundle/release/app-release.aab
